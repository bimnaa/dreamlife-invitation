<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 인카금융 드림라이프총괄 환영식 초청장</title>
    <!-- 구글 폰트 적용 (Noto Sans KR, Gowun Batang) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* 기본 스타일 초기화 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8f9fa;
            color: #333333;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 모바일 최적화 컨테이너 (최대 가로폭 430px - 아이폰/갤럭시 기준) */
        .invitation-container {
            width: 100%;
            max-width: 430px;
            background-color: #ffffff;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.08);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* 상단 메인 섹션 */
        .header-section {
            background-color: #0A2342; /* 인카금융 신뢰감을 주는 네이비 */
            color: #ffffff;
            text-align: center;
            padding: 60px 20px;
            position: relative;
        }
        .company-tag {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 3px;
            color: #D4AF37; /* 고급스러운 골드 포인트 */
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .main-title {
            font-family: 'Gowun Batang', serif;
            font-size: 24px;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
        }
        .sub-title {
            font-size: 15px;
            font-weight: 300;
            color: #e0e0e0;
            letter-spacing: 0.5px;
        }

        /* 중간 구분선 스타일 */
        .divider {
            text-align: center;
            margin: 40px 0;
        }
        .divider::after {
            content: "";
            display: inline-block;
            width: 40px;
            height: 1px;
            background-color: #D4AF37;
        }

        /* 초대의 글 섹션 */
        .greeting-section {
            padding: 20px 30px;
            text-align: center;
        }
        .greeting-text {
            font-family: 'Gowun Batang', serif;
            font-size: 16px;
            color: #4A4A4A;
            line-height: 2;
            word-break: keep-all;
        }

        /* 일시 및 장소 상세 섹션 */
        .info-section {
            background-color: #F9FAFB;
            margin: 40px 20px;
            padding: 30px 20px;
            border-radius: 12px;
            border: 1px solid #ededed;
        }
        .info-box {
            margin-bottom: 25px;
            text-align: center;
        }
        .info-box:last-child {
            margin-bottom: 0;
        }
        .info-label {
            font-size: 13px;
            font-weight: 700;
            color: #0A2342;
            letter-spacing: 1px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .info-value {
            font-size: 16px;
            font-weight: 500;
            color: #222222;
        }

        /* 하단 푸터 */
        .footer-section {
            margin-top: auto;
            padding: 40px 20px;
            text-align: center;
            background-color: #ffffff;
            font-size: 13px;
            color: #888888;
            letter-spacing: 1px;
        }

        /* 부드러운 등장 애니메이션 */
        .fade-in {
            animation: fadeIn ease 1.5s;
            -webkit-animation: fadeIn ease 1.5s;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="invitation-container fade-in">
        
        <!-- 상단 메인 비주얼 -->
        <header class="header-section">
            <div class="company-tag">Incar Financial Service</div>
            <h1 class="main-title">
                2026 인카금융<br>
                드림라이프총괄 환영식
            </h1>
            <p class="sub-title">귀하를 정중히 초대합니다.</p>
        </header>

        <!-- 본문 내용 (초대의 글) -->
        <section class="greeting-section">
            <div class="divider"></div>
            <p class="greeting-text">
                새로운 시작,<br>
                그리고 더 큰 미래를 향한 도약.<br>
                <br>
                드림라이프와 인카금융서비스가 함께 만들어갈<br>
                새로운 비전의 순간에 여러분을 모십니다.<br>
                <br>
                부디 참석하시어<br>
                뜻깊은 자리를 함께 빛내주시기 바랍니다.
            </p>
            <div class="divider"></div>
        </section>

        <!-- 안내 정보 (일시/장소) -->
        <section class="info-section">
            <div class="info-box">
                <div class="info-label">WHEN</div>
                <div class="info-value">2026년 6월 22일(월) 오후 3시</div>
            </div>
            <div class="info-box">
                <div class="info-label">WHERE</div>
                <div class="info-value">광주 김대중컨벤션센터 4F 컨벤션홀</div>
            </div>
        </section>

        <!-- 하단 정보 -->
        <footer class="footer-section">
            © 2026 INCAR Financial Services Inc.
        </footer>

    </div>

</body>
</html>
